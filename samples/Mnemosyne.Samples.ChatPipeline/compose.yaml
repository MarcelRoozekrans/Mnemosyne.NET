# PostgreSQL 17 with pgvector for the sample. Start it with `docker compose up -d --wait`, which returns once the
# health check passes, and stop it with `docker compose down`. The credentials and database match the sample's
# default connection string. It listens on port 5434, so it can run next to the other samples' databases.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mnemosyne_chat_sample
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mnemosyne_chat_sample"]
      interval: 2s
      timeout: 5s
      retries: 15
