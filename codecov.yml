coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 100%
        threshold: 0%
ignore:
  - "tests/**"
  - "benchmarks/**"
  - "samples/**"
  - "**/obj/**"
  - "**/*.g.cs"
# CI builds the src/ projects with ContinuousIntegrationBuild, so their PDBs, and the Cobertura
# reports read from them, carry /_/ paths instead of the runner's checkout path. Map them back.
fixes:
  - "/_/::"
