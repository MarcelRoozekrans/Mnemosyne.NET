name: Release Please

# The release half of the versioning design (the derivation half is GitVersion, see
# GitVersion.yml): release-please reads the conventional commits since the last release,
# opens a pull request proposing the version they imply, and, when that PR is merged,
# creates the GitHub release and the vX.Y.Z tag. That tag is what flips GitVersion from
# prerelease (0.1.0-preview.N) to stable: on the tagged commit it returns the tag's version,
# and publish-nuget packs and pushes exactly that.
#
#   1. THE USER MERGES THE RELEASE PR. This workflow only ever proposes. A release PR
#      sitting open is not a release, and nothing here can make it one.
#   2. THIS WORKFLOW CANNOT PUBLISH. It creates the tag and the GitHub release; the release's
#      `published` event starts ci.yml, whose publish-nuget job ships the tag once the full
#      matrix and the pack rehearsal are green on that commit.
#
# workflow_dispatch is kept alongside the push trigger, for re-running after a flake and for
# the case a push event was never delivered.
#
# ONE GITHUB BEHAVIOUR WORTH KNOWING: events raised by the built-in GITHUB_TOKEN do not start
# workflow runs. With that token the release PR would arrive with no CI on it, and the GitHub
# release it creates would raise no `published` event, so publish-nuget would never run.
# release-please therefore runs on a token from the release bot GitHub App, whose events start
# workflows like anyone's.
on:
  # Keeps the release PR current with main. Merging that PR is itself a push to main, so the
  # same trigger then creates the tag and the GitHub release, with no second dispatch needed.
  push:
    branches: [main]
  workflow_dispatch:

# Every write (the release PR, the tag, the GitHub release) goes through the App token minted
# below, so the built-in GITHUB_TOKEN only needs to read.
permissions:
  contents: read

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pushes and PRs made with GITHUB_TOKEN trigger no workflows, so bot PRs
      # never got their required checks. A token from the release bot GitHub App
      # acts as the App, and its pushes trigger CI like anyone else's.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # The action reads release-please-config.json and .release-please-manifest.json. It must
      # not be given a release-type input: any such input makes the action build its manifest
      # from inputs alone and ignore the config file, which would drop every rule below.
      #
      # The config sets release-type simple (the release PR maintains CHANGELOG.md and a
      # version.txt, which nothing in the build consumes; GitVersion derives the build's version
      # from the tag this workflow creates) and bump-minor-pre-major, which keeps a breaking
      # change on 0.x at a minor bump. The manifest records the last released version, 0.0.0
      # because nothing has been released. With no tag to count from, release-please would fall
      # back to its default first release of 1.0.0, so the config's initial-version of 0.1.0 is
      # the reason the first release PR proposes 0.1.0.
      - name: Create or update the release pull request
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
